{% extends "base.html" %}

{% block title %}Couldn't compare — SignaVerify{% endblock %}

{% block content %}
    <section class="page-section">
      <div class="container">
        <div class="page-head" role="alert">
          <h1>The comparison didn't run</h1>
          <p>{{ message }}</p>
        </div>
        <div class="action-section">
          <a href="{{ url_for('index') }}#tool" class="btn-primary">Try again</a>
        </div>
      </div>
    </section>
{% endblock %}
